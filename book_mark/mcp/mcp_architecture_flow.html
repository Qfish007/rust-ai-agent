:root {
  color-scheme: light;

  --text-caption: 12px/18px;
  --text-body: 14px/20px;

}
:root[data-widget-theme="dark"] {
  color-scheme: dark;

  --accent-soft: #123F3C;
  --accent-text: #CCFBF1;
}
.widget { color: var(--text); background: transparent; font: var(--weight-regular) var(--text-body) var(--font-sans); }

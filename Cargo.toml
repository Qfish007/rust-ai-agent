[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-openai = { version = "0.43.0", features = ["chat-completion", "embedding"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
backon = "1.6.0"# backon 处理重试
dotenvy = "0.15.7"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
schemars = "1.2.3" # 用于生成 结构化输出
serde= { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rmcp = { version = "3.8.0", features = [
    "client",
    "server",
    "macros",
    "transport-child-process",
    "transport-io",
] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4"] }
tiktoken-rs = "0.12.0"
csv = "1.4.0"
zip = "8.6.0"
base64 = "0.23.1"